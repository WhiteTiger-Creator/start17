name = "regulatory-reporting-engine"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''Restoring this submission run is the work of a regulatory-reporting or compliance-technology engineer picking up after a botched reference-data migration, and it is a dependent chain rather than a single repair. All of the data is synthetic: the trade ids, counterparties, LEIs, venues and the committee minutes were generated for this task and describe no real firm, trade or person. The migration left /app/data/transaction_ledger.json holding a truncated prefix of the ledger, so the first step is to rebuild it by replaying the migration journal onto the pre-migration snapshot under the committee's final recovery decision -- each change keyed on the booking it names, the trade id and version together, an amendment overwriting a field in place, a withdrawal taking a booking out while the migrator keeps it as it then stood, and a reinstatement returning exactly that held state so an amendment posted while the booking was out is lost. Which bookings survive decides which version of each trade is the live one, so every filing decision rests on it. Only then can the reporting dialect be reconstructed, and the minute book is written the way a compliance committee actually writes: it records where the committee departed from the intuitive reading and never restates what a notional, a deadline or a delegated filing means. Three February drafts were reversed in the May review and one March interim was revised, so every rule must be traced to its FINAL dated decision: the obligation follows the REPORTING side alone rather than requiring both sides in scope, the HIGHEST version of a re-booked trade supersedes the earlier ones rather than the first standing as the filing, the deadline counts BUSINESS days across a calendar carrying weekends and eleven holidays rather than plain calendar days, and an unconfirmed booking is queued without consuming the submission cap rather than being filed. Those four interact: scope and the dollar threshold decide the eligible population, the version rule decides which notional is tested against that threshold, the deadline decides submission order, and the cap then decides which eligible bookings are actually filed -- so a wrong rule anywhere changes not merely a flag but which trades appear in the return at all.'''
solution_explanation = '''solution/solve.sh drives the two dependent steps inside the environment container. Step one runs solution/recover_ledger.go, which implements the committee's final recovery decisions (#REG-7170 and #REG-7174): it starts from /app/data/ledger_snapshot_pre_migration.json, replays /app/data/ledger_journal.json in ascending seq keyed on trade id and version, applies an amendment in place, holds a withdrawn booking aside as it then stood, returns exactly that held state on a reinstatement, ignores a change naming an unknown booking, and writes the survivors over the truncated /app/data/transaction_ledger.json ascending by trade id then version. Step two copies solution/build_report_fixed.go over /app/workflow/build_report.go and runs it. The engine keeps only the highest version of each trade id (#REG-7182), admits a trade only where the reporting party is in scope and not classified below the clearing threshold (#REG-7186), carries the notional into whole US dollars at the rate table's figure before testing the policy floor (#REG-7188), resolves the filer through any delegation and reports the delegate's LEI (#REG-7192), reaches the deadline by counting business days forward across the regulatory calendar and marks a later submission late (#REG-7190), queues an unconfirmed booking without consuming the cap (#REG-7194), and takes submissions in deadline then trade-id order until the cap is reached, queueing the remainder (#REG-7196).'''
verification_explanation = '''The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is graded directly: the rebuilt ledger must match the sealed digest and booking count, carry only the eleven declared fields with no migrator bookkeeping surviving, and leave the snapshot, journal, register, calendar, rate table and policy byte-identical. The verifier re-derives the misreadings of the replay from those same sources -- a plain concatenation, a replay in file order rather than by sequence, and one where a reinstatement re-reads the snapshot instead of the held state -- and requires each to differ from the governed result. Step two recompiles the agent's submitted /app/workflow/build_report.go from source with go build rather than trusting any delivered binary, runs it under an unprivileged uid (65534 via setpriv, a scrubbed environment, inputs staged into a candidate-writable work area) on both the recovered ledger and a held-out alternate ledger, and compares summary.json in full plus SHA-256 digests of report_lines.json and exception_queue.jsonl against sealed fixtures generated from the reference. Crafted micro-instances pin each reversed rule independently: one proves a trade files on the reporting side alone even where the other side is out of scope, one proves the highest version supersedes the first, one proves the deadline steps over a holiday and a weekend rather than counting calendar days, and one proves an unconfirmed booking is queued without consuming a place against the cap. The run is timed against the ninety-second budget the contract publishes. The frozen snapshot /app/workflow/.build_report.original.go is asserted present by hash and wrong by output. Confirmed locally in the real two-container flow: after solve.sh the verifier gives reward 1, a fresh environment with no solve.sh gives 0, and so does an environment where the engine is repaired but the ledger is never rebuilt.'''
relevant_experience = '''Working knowledge of transaction reporting as a discipline -- reporting obligation and scope, counterparty classification, LEI and delegated filing, notional thresholds, business-day deadlines and late submission taken as read rather than looked up -- plus experience rebuilding a trade ledger by replaying a migration journal onto a snapshot, and reconstructing a reporting dialect from an authoritative but noisy committee minute book that records only its departures from the intuitive reading, tracing incrementally-revised rules to their final form and matching a strict output contract in Go.'''
category = "Operations"
subcategory = "Compliance"
tags = ["regulatory-reporting", "transaction-reporting", "business-day-calendar", "counterparty-scope", "incident-recovery"]
expert_time_estimate_hours = 4
difficulty = "advanced"
languages = ["go"]

